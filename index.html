        const x=(T0+t2*TS+TS/2)*K,w=TS*K-6;c.save();c.globalAlpha=0.3+0.25*Math.sin(S.t*6);c.fillStyle=PAL.y;rr(c,x-w/2,FLOOR-70,w,70,8);c.fill();c.restore();
        arrow(x,FLOOR-78,1);
        pill(c,T('tut1'),W/2,CEIL+160,17,PAL.y,PAL.k);
      }else if(S.tut===1&&S.goBtn){
        {const gx=S.goBtn.x+S.goBtn.w+10+Math.abs(bob),gy=S.goBtn.y+S.goBtn.h/2;c.save();c.translate(gx,gy);c.rotate(Math.PI/2);c.translate(0,-bob);arrow(0,0,1);c.restore()}
        pill(c,T('tut2'),W/2,CEIL+170,17,PAL.y,PAL.k);
      }
    }
    // 底栏
    hudBar(c,BAR,H-BAR,false);
    for(const r of slotRects()){
      const k=r.k,sel=k===S.sel,can=S.gold>=costOf(k);const y=r.y+(sel?-3:0);
      bevel(c,r.x,y,r.w,r.h-6,sel?'#fffaf0':'#ffe6f1',{depth:sel?6:4,r:8,ring:sel?PAL.y:null,shadow:false,dark:'#d68ab0'});
      c.globalAlpha=can?1:0.4;
      c.fillStyle='rgba(214,138,176,0.35)';rr(c,r.x+5,y+5,34,r.h-16,6);c.fill();
      icon(c,k,r.x+22,y+(r.h-6)/2,0.8);fitTxtO(c,TD[k].name,r.x+46,y+(CMP?19:16),r.w>130?(CMP?18:16):15,r.w-52,PAL.w,'left',800,3);
      {const cost=costOf(k);drawSpr(c,tspr('coin'),r.x+53,y+(CMP?47:38),1.7);fitTxtO(c,String(cost),r.x+62,y+(CMP?41:33),CMP?15:13,r.w-68,can?PAL.y:PAL.r,'left',800,3)}
      c.globalAlpha=1;
    }
    // 陷阱说明：底栏顶部那一行显示当前选中陷阱的作用（鼠标停在别的陷阱上时显示那个），不挡地面
    if(S.phase!=='draft'&&!S.over&&!S.win){const hv=S.hover&&S.hover.y>=BAR?slotRects().find(r=>S.hover.x>=r.x&&S.hover.x<=r.x+r.w):null;
      const k=hv?hv.k:S.sel;
      if(k&&TD[k])fitTxtO(c,T('goalLine',{name:TD[k].name,text:TD[k].desc}),W/2,BAR+7+DESC/2,15,W-40,PAL.w,'center',800,3)}
    // 提示
    if(S.phase==='break'&&!S.over&&!S.win&&S.wave===0&&S.lv){
      const Lv=S.lv;pill(c,T('lvTitle',{id:Lv.id,n:Lv.waves}),W/2,CEIL+110,16,PAL.y,PAL.k);let yy=CEIL+146;
      if(Lv.newT&&Lv.i>0){pill(c,T('newTrapLv',{name:TD[Lv.newT].name,desc:TD[Lv.newT].desc}),W/2,yy,14,PAL.c,PAL.k);yy+=34}
      for(const rt of ruleTexts(Lv).slice(0,3)){pill(c,rt,W/2,yy,14,'rgba(0,0,0,1)',PAL.o);yy+=34}
    }
    if(S.phase==='break'&&!S.over&&!S.win){
      pill(c,T('next',{s:summary(S.preview)}),W/2,CEIL+28,15,'rgba(0,0,0,1)',PAL.w);
      {const gl=T('go',{n:Math.ceil(S.breakT)});c.font=`800 17px ${FONT}`;const gw=c.measureText(gl).width+40;S.goBtn={x:W/2-gw/2,y:CEIL+50,w:gw,h:40};const pulse=S.tut===1?1+0.05*Math.sin(S.t*8):1;c.save();c.translate(W/2,CEIL+68);c.scale(pulse,pulse);bevel(c,-gw/2,-19,gw,34,'#4fbf6a',{depth:5,r:8});txtO(c,gl,0,-2,17,PAL.w,'center',800,4);c.restore()}
      if(S.wave===0&&(!S.lv||S.lv.i===0)&&!S.tut)pill(c,T('hint',{a:ALL.filter(k=>M.unlocked[k]).length,b:ALL.length}),W/2,CEIL+230,14,'rgba(0,0,0,1)',PAL.w);
    }
    if(S.announce)pill(c,S.announce.text,W/2,CEIL+28,15,S.announce.col||PAL.c,PAL.k);
    if(S.unlock)pill(c,S.unlock.text,W/2,CEIL+160,17,PAL.y,PAL.k);
    if(S.msgT>0)pill(c,S.msg,W/2,CEIL+196,15,PAL.r,PAL.w);
    if(S.phase!=='draft')drawPops(c,S);
    if(S.phase==='draft'&&!S.over&&!S.win&&S.draft){
      c.fillStyle='rgba(120,50,100,0.55)';c.fillRect(0,CEIL,W,BAR-CEIL);
      txtO(c,T('pickCard',{n:S.wave}),W/2,CEIL+20,20,PAL.w,'center',800);
      S.draft.forEach((cd,i)=>drawCard(c,cd,CARD(i)));
      const can=S.gold>=rerollCost();bevel(c,RER.x,RER.y,RER.w,RER.h-4,can?'#d886bc':'#c86aa8',{depth:4,r:8});
      txtO(c,T('reroll',{n:rerollCost()}),W/2,RER.y+RER.h/2-3,15,can?PAL.w:'#8a80a8','center',800,3);
      if(S.unlock)pill(c,S.unlock.text,W/2,CEIL+160,17,PAL.y,PAL.k);
    }
    const BY=H-(CMP?70:76);
    const dim=()=>{c.fillStyle='rgba(110,40,95,0.82)';c.fillRect(0,0,W,H)};
    if(S.win){
      dim();const y0=CMP?60:100,Lv=S.lv;
      txtO(c,T('winT',{id:Lv.id}),W/2,y0,CMP?38:44,PAL.y,'center',800,7);
      for(let k=0;k<3;k++){const a=clamp((S.win.t-0.3-k*0.35)*4,0,1),on=k<S.win.stars&&a>0;const sz=(on?(1+0.4*(1-a)):1)*8;drawSpr(c,tspr(on?'star':'starE'),W/2+(k-1)*80,y0+112-(k===1?10:0),sz)}
      txtO(c,T('winStats',{k:S.kills,e:S.lost}),W/2,y0+140,17,PAL.w,'center',700,3);
      if(S.win.stars<3)txt(c,T('star3'),W/2,y0+172,15,'#a99fc4','center',600);
      else if(Lv.i===LV.length-1)txtO(c,T('allDone'),W/2,y0+172,17,PAL.g,'center',800);
      const d=[];if(LV[Lv.i+1])d.push({id:'next',label:T('nextLv'),w:240,col:'#f0b030',fg:PAL.w});d.push({id:'retry',label:T('retry'),w:170},{id:'menu',label:T('menu'),w:150});
      S.btns=btnRow(d,BY);drawBtns(c,S.btns);
    }
    if(S.over&&S.lv){
      dim();const y0=CMP?70:110;
      txtO(c,T('lost'),W/2,y0,CMP?38:44,PAL.r,'center',800,7);
      txt(c,T('lostLv',{w:S.wave,m:S.lv.waves,k:S.kills}),W/2,y0+46,17,'#c9bfe6','center',600);
      txtO(c,T('lvTitle',{id:S.lv.id,n:S.lv.waves}),W/2,y0+90,16,PAL.y,'center',800,3);
      ruleTexts(S.lv).slice(0,3).forEach((rt,k)=>txt(c,rt,W/2,y0+122+k*26,14,PAL.o,'center',600));
      const d=[];if(HOOK.revive&&!S.revived)d.push({id:'revive',label:T(HOOK.reviveKey||'revive'),w:330,col:'#4fbf6a',fg:PAL.w});d.push({id:'retry',label:T('retry'),w:170},{id:'menu',label:T('menu'),w:150});
      S.btns=btnRow(d,BY);drawBtns(c,S.btns);
    }
    if(S.over&&!S.lv){
      dim();
      const y0=CMP?36:70;
      txtO(c,T('lost'),W/2,y0,CMP?34:42,PAL.r,'center',800,6);
      txt(c,T('lostStats',{w:Math.max(0,S.wave-1),k:S.kills,b:getBest('trap3')}),W/2,y0+(CMP?36:48),CMP?16:18,'#c9bfe6','center',600);
      const locked=GOALS.filter(gl=>!M.unlocked[gl.id]);
      txtO(c,T('unlockProg',{a:ALL.filter(k=>M.unlocked[k]).length,b:ALL.length}),W/2,y0+(CMP?70:100),17,PAL.y,'center',800,3);
      const ly=y0+(CMP?104:136),lstep=CMP?32:40,rh=CMP?28:32;
      if(!locked.length)txt(c,T('allUnlocked'),W/2,ly,17,PAL.w,'center',700);
      locked.slice(0,CMP?(H<470?4:5):6).forEach((gl,i)=>{const[a,b]=gl.p(),y=ly+i*lstep;bevel(c,W/2-270,y-rh/2,540,rh-3,'#c86aa8',{depth:3,r:6,shadow:false});icon(c,gl.id,W/2-246,y-1,0.7);
        fitTxt(c,T('goalLine',{name:TD[gl.id].name,text:gl.text}),W/2-222,y-1,15,430,PAL.w,'left',600);txtO(c,`${Math.min(a,b)}/${b}`,W/2+256,y-1,15,PAL.y,'right',800,3)});
      const d=[];if(HOOK.revive&&!S.revived)d.push({id:'revive',label:T(HOOK.reviveKey||'revive'),w:330,col:'#4fbf6a',fg:PAL.w});d.push({id:'retry',label:T('restart'),w:170},{id:'menu',label:T('menu'),w:150});
      S.btns=btnRow(d,BY);drawBtns(c,S.btns);
    }
    c.restore();
  };
  if(/debug/.test(location.search)){g.debug=()=>S;g.dbgBegin=(m,i)=>begin(m,i);g.LV=LV;g.meta=()=>M;g.spawn=spawnHero;g.place=(type,ti)=>{S.traps.push({id:++uid,paid:0,type,tile:ti,x:tileX(ti),uses:maxUses(type),arm:0,open:false,openT:0,cd:0.3,rockY:WCEIL+34,rockVy:0,rockOn:false,done:false,doneT:0,ft:Math.random()*2,lastKill:null})};g.geo={NT,TS,T0,K,FLOOR,WCEIL,WW,WBAR,yTop,yBot,EXIT};g.renderWorld=(c,s,ox,oy)=>{c.save();c.setTransform(s,0,0,s,-ox*s,-oy*s);c.imageSmoothingEnabled=false;drawScene(c,{ceil:true});for(const t of S.traps)drawTrap(c,t);for(const b of S.balls){const R2=b.big?8:5,i=((Math.floor(-b.rot/(Math.PI/4))%8)+8)%8;drawSpr(c,boulderSpr(R2,i),b.x,FLOOR+PX)}for(const a of S.arrows)drawSpr(c,tspr('arrow'),a.x+10,a.y+6);for(const h of S.heroes)drawHero(c,h);S.fx.draw(c);c.restore()};g.flame=(t,on)=>{t.ft=on?1.9:0.2};g.txtO=txtO}
  return g;
}

/* ===== CrazyGames SDK v3 接入 ===== */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let game=null,CG=null;
function applyLang(){try{document.title=T('title');const r=document.querySelector('#rotate div');if(r)r.textContent=T('rotate');document.documentElement.lang=LANG}catch(e){}}window.__onLang=applyLang;applyLang();
let playing=false,adPlaying=false,last=0,setMute=false;
const cgSafe=f=>{try{return f()}catch(e){return undefined}};
function applyMute(){SFX.setAdMute(adPlaying||setMute)}
function gpStart(){if(playing||adPlaying)return;playing=true;if(CG)cgSafe(()=>CG.game.gameplayStart())}
function gpStop(){if(!playing)return;playing=false;if(CG)cgSafe(()=>CG.game.gameplayStop())}
function showAd(type){
  return new Promise(res=>{
    if(!CG){res(true);return}
    gpStop();let done=false;const end=ok=>{if(done)return;done=true;adPlaying=false;applyMute();res(ok)};
    try{CG.ad.requestAd(type,{adStarted:()=>{adPlaying=true;applyMute()},adFinished:()=>end(true),adError:()=>end(false)})}catch(e){end(false)}
  });
}
HOOK.stop=()=>gpStop();
HOOK.play=()=>{if(game&&game.inPlay())gpStart()};
HOOK.happy=()=>{if(CG)cgSafe(()=>CG.game.happytime())};
HOOK.ad=cb=>{showAd('midgame').then(()=>{cb();HOOK.play()})};
HOOK.revive=cb=>{showAd('rewarded').then(ok=>{cb(!!ok);if(ok)gpStart()})};

function resize(){const r=cv.getBoundingClientRect();if(!r.width)return;const d=Math.min(3,window.devicePixelRatio||1);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d)}
function avail(){const w=document.getElementById('wrap');const cs=getComputedStyle(w);return{aw:w.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah:w.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)}}
function wantH(){const a=avail();if(!a.aw||!a.ah||a.ah>a.aw)return H;return Math.round(clamp(W*a.ah/a.aw,420,600))}
function fit(){const a=avail();if(!a.aw||!a.ah)return;const sc=Math.min(a.aw/W,a.ah/H);cv.style.width=Math.floor(W*sc)+'px';cv.style.height=Math.floor(H*sc)+'px';resize()}
function layout(force){const nh=wantH();if(!game||(Math.abs(nh-H)>8&&(force||game.fresh()))){H=nh;game=TrapGame();game.reset()}fit()}
window.addEventListener('resize',()=>layout(false));
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(adPlaying||!game)return;try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=pt(e);game.move(p.x,p.y);game.down(p.x,p.y);if(game.inPlay())gpStart()});
cv.addEventListener('pointermove',e=>{if(adPlaying||!game)return;const p=pt(e);game.move(p.x,p.y)});
window.addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(adPlaying||!game)return;
  if((e.code==='Space'||e.code==='Enter')&&game.inPlay()){gpStart();game.skip()}
});
window.addEventListener('wheel',e=>e.preventDefault(),{passive:false});
window.addEventListener('contextmenu',e=>e.preventDefault());
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000||0);last=t;
  if(!adPlaying&&!window.__manual)game.update(dt);
  if(cv.width){ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);game.draw(ctx)}
  requestAnimationFrame(frame);
}
if(/debug/.test(location.search))window.__game=()=>game;
let booted=false;
function boot(){if(booted)return;booted=true;layout(true);if(CG)cgSafe(()=>CG.game.loadingStop());try{game.autoStart()}catch(e){}requestAnimationFrame(frame)}
(async()=>{
  try{CG=await Promise.race([window.__cgInit||Promise.resolve(null),new Promise(r=>setTimeout(()=>r(null),3000))])}catch(e){CG=null}
  if(CG){
    const st=cgSafe(()=>CG.game.settings);setMute=!!(st&&st.muteAudio);applyMute();
    cgSafe(()=>CG.game.addSettingsChangeListener(ns=>{setMute=!!(ns&&ns.muteAudio);applyMute()}));
    const D=cgSafe(()=>CG.data);
    if(D&&D.getItem){
      for(const k of ['kyz_meta_v1','proto3_best_trap3','kyz_lang','kyz_mute']){const v=cgSafe(()=>D.getItem(k));if(v==null){const lv=cgSafe(()=>window.localStorage.getItem(k));if(lv!=null)cgSafe(()=>D.setItem(k,lv))}}
      CGSTORE.b=D;
    }
    let saved=null;try{saved=CGSTORE.getItem('kyz_lang')}catch(e){}
    const q=new URLSearchParams(location.search).get('lang');
    if(!q&&!(saved&&LANGS.includes(saved))){const loc=String(cgSafe(()=>CG.user.systemInfo.locale)||'').slice(0,2).toLowerCase();if(LANGS.includes(loc))LANG=loc}
    else if(!q&&saved)LANG=saved;
    applyLang();
  }
  boot();
})();
})();
</script>
